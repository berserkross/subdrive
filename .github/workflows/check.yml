name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt cryptography
      # 文档漂移闸：README/AGENTS 里的行数、用例数、路径引用必须与仓库一致。
      - name: Docs consistency
        run: python scripts/check_docs.py
      # stub 模式完全离线：不需要 Seafile，也不写仓库目录。
      - name: Backend tests (stub mode)
        run: |
          python tests/test_smoke.py
          python tests/test_features.py
          python tests/test_shared.py
          python tests/test_storage_live.py
      - name: JS tests (crypto vector + upload plan)
        run: |
          node tests/test_crypto.mjs
          node tests/test_uploadplan.mjs
      # 浏览器 e2e 需要本机 Chrome/Edge，不在 CI 里跑；发版前本地执行
      # tests/e2e/test_e2e_browser.py。
