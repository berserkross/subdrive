<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>积木编辑器 · SubDrive</title>
<style>
:root {
  color-scheme: light;
  --paper: #fff;
  --canvas: #f1f0ed;
  --line: #e5e3df;
  --ink: #252421;
  --muted: #66635e;
  --soft: #f6f5f3;
  --accent: #5038bd;
  --tint: #efebff;
  font: 14px/20px Inter, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  color: var(--ink);
}
* { box-sizing: border-box; }
body { margin: 0; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
button, select, input[type=number], input[type=text] {
  height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper);
}
button { padding: 0 12px; cursor: pointer; white-space: nowrap; }
select, input[type=text], input[type=number] { padding: 0 8px; min-width: 0; }
button:hover:not(:disabled) { background: var(--soft); }
button:disabled { opacity: .42; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.primary { background: #292824; color: white; border-color: #292824; font-weight: 650; }
.primary:hover:not(:disabled) { background: #46433f; }
.quiet, .icon { border-color: transparent; background: transparent; }
.icon { width: 36px; padding: 0; font-size: 20px; }
.mast { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 68px; padding: 8px 20px; border-bottom: 1px solid var(--line); }
.identity, .top-actions, .history, .canvas-tools { display: flex; align-items: center; gap: 8px; }
.identity { gap: 12px; }
.identity img { border-radius: 8px; }
.product { color: var(--muted); font-size: 12px; line-height: 16px; display: block; }
h1 { font-size: 18px; line-height: 24px; letter-spacing: -.025em; }
h2 { font-size: 14px; line-height: 20px; }
.history { gap: 0; padding: 0 8px; margin-right: 4px; border-right: 1px solid var(--line); }
.workspace { display: grid; grid-template-columns: 216px minmax(0, 1fr) 284px; min-height: 0; flex: 1; }
.rail { background: var(--paper); min-height: 0; overflow: auto; }
.layers { border-right: 1px solid var(--line); }
.inspector { border-left: 1px solid var(--line); }
.panel-head { display: flex; justify-content: space-between; align-items: center; min-height: 56px; padding: 8px 20px; border-bottom: 1px solid var(--line); }
#layers { padding: 12px; }
.layer {
  display: grid; align-items: center; grid-template-columns: 32px minmax(0, 1fr); gap: 4px;
  border: 1px solid transparent; border-radius: 8px; margin-bottom: 4px;
}
.layer.is-selected { background: var(--tint); color: #392394; }
.layer.is-target { border-top-color: var(--accent); }
.layer button { border: 0; background: transparent; color: inherit; }
.layer-handle { padding: 0; font-size: 18px; touch-action: none; cursor: grab; }
.layer-name { padding: 0 8px 0 0; display: flex; align-items: center; justify-content: space-between; text-align: left; gap: 4px; }
.layer-name > span:last-child { font-size: 11px; color: var(--muted); }
.layer-tools { display: grid; gap: 8px; border-top: 1px solid var(--line); padding: 16px; }
.layer-tools label { font-weight: 650; margin-bottom: 4px; }
#sticker-layers { padding: 0 12px; }
.snap-control { display:flex; align-items:center; gap:4px; white-space:nowrap; font-size:12px; }
.snap-control input { accent-color:var(--accent); }
.stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--canvas); }
.stage-bar { min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 20px; border-bottom: 1px solid #e2dfda; }
.stage-label { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.stage-label span, .stage-foot { color: var(--muted); font-size: 12px; }
.device { display: flex; padding: 4px; border-radius: 8px; background: #e7e5e0; }
.device button { height: 32px; background: transparent; border: 0; }
.device button[aria-pressed=true] { background: #fff; box-shadow: 0 1px 2px #211e151a; }
.stage-scroll { flex: 1; min-height: 0; padding: 16px 20px; display: flex; justify-content: center; overflow: auto; }
.preview-shell { width: min(calc((100% - 2px) * var(--zoom, 1) + 2px), calc(1078px * var(--zoom, 1) + 2px)); border: 1px solid #dedbd4; border-radius: 12px; overflow: hidden; background: #fff; box-shadow: 0 8px 32px #34302012; }
iframe { border: 0; display: block; width: 100%; height: 100%; }
.phone .preview-shell { max-width: calc(390px * var(--zoom, 1) + 2px); }
.stage-foot { min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 20px; border-top: 1px solid #e2dfda; }
kbd { font: inherit; background: #fff; border: 1px solid var(--line); padding: 0 4px; border-radius: 4px; }
.selected-head { padding: 16px 20px; }
.selected-head h3 { font-size: 20px; line-height: 28px; }
.selected-head p, .hint, .empty-inspector { color: var(--muted); font-size: 12px; line-height: 20px; }
.empty-inspector { padding: 20px; }
.group { padding: 12px 20px 16px; border-top: 1px solid var(--line); }
.group h3 { font-size: 13px; margin-bottom: 8px; }
.field { display: grid; grid-template-columns: minmax(0, 1fr) auto 32px; align-items: center; gap: 8px; min-height: 44px; }
.field label, .field-name { font-size: 13px; }
.field input[type=number] { width: 68px; }
.field input[type=checkbox] { accent-color: var(--accent); width: 18px; height: 18px; margin: 0 4px; }
.field .clear { width: 32px; height: 32px; font-size: 16px; }
.color-control { display: flex; align-items: center; gap: 4px; }
.color-control input[type=text] { width: 76px; font-size: 12px; font-variant-numeric: tabular-nums; }
.color-control input[type=color] { width: 28px; height: 32px; border: 0; padding: 0; background: transparent; cursor: pointer; }
.field-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.field-buttons button { padding: 0 8px; font-size: 12px; }
.hint { margin-top: 8px; }
.sticker-preview { display: block; height: 64px; width: 100%; object-fit: contain; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); }
.sticker-target[aria-pressed=true] { color: var(--accent); background: var(--tint); }
.status { pointer-events: none; position: fixed; bottom: 56px; left: 50%; translate: -50% 0; z-index: 10; max-width: calc(100vw - 24px); padding: 8px 12px; border-radius: 8px; background: #292824; color: white; }
.status:empty { display: none; }
.sr-only { position: absolute; width: 1px; height: 1px; clip-path: inset(50%); overflow: hidden; }
#layers-toggle, #inspector-toggle, .mobile-close { display: none; }
.show-effect .workspace { grid-template-columns: minmax(0, 1fr); }
.show-effect .rail, .show-effect .stage-foot { display: none; }
dialog { width: min(380px, calc(100% - 32px)); border: 1px solid var(--line); border-radius: 12px; padding: 20px; color: var(--ink); }
dialog::backdrop { background: #29282466; }
dialog p { margin: 8px 0 16px; color: var(--muted); }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
@media (max-width: 899px) {
  .workspace { grid-template-columns: minmax(0, 1fr); position: relative; --drawer-height: min(46dvh, 416px); }
  .rail { display: none; position: absolute; z-index: 3; inset: auto 0 0; height: var(--drawer-height); border: 1px solid var(--line); border-radius: 16px 16px 0 0; box-shadow: 0 -8px 32px #34302024; }
  .rail.is-open { display: block; }
  .workspace:has(.rail.is-open) .stage-scroll { margin-bottom: calc(var(--drawer-height) - 44px); }
  .panel-head { position: sticky; top: 0; z-index: 1; background: var(--paper); min-height: 48px; }
  #layers-toggle, #inspector-toggle, .mobile-close { display: inline-block; }
  .show-effect #layers-toggle { display: none; }
  .stage-scroll { padding: 12px; }
  .stage-bar, .stage-foot { padding-inline: 12px; }
}
@media (max-width: 560px) {
  .mast { min-height: 60px; padding: 8px 12px; flex-wrap:wrap; }
  .identity { gap: 8px; }
  h1 { font-size: 16px; }
  .history { padding: 0 4px 0 0; margin: 0; }
  .history .icon { width: 32px; }
  .stage-bar { min-height: 52px; }
  .stage-bar { flex-wrap:wrap; }
  .canvas-tools { flex-wrap:wrap; }
  .top-actions { gap:4px; flex-wrap:wrap; }
  .top-actions button { padding-inline:8px; }
  .stage-label { display:none; }
  .stage-label span, .stage-foot span:nth-child(2), .device { display: none; }
  .stage-foot { min-height: 48px; }
}

</style>
<body>
<header class="mast">
  <div class="identity">
    <img src="/static/logo.png" width="32" height="32" alt="">
    <div><span class="product">SubDrive</span><h1>积木编辑器</h1></div>
  </div>
  <div class="top-actions">
    <button id="close-editor" hidden>关闭</button>
    <div class="history" aria-label="编辑历史">
      <button id="undo" class="icon" aria-label="撤销" title="撤销 (Ctrl+Z)" disabled>↶</button>
      <button id="redo" class="icon" aria-label="重做" title="重做 (Ctrl+Shift+Z)" disabled>↷</button>
    </div>
    <button id="preview" class="primary" aria-pressed="false">查看效果</button>
    <button id="save-editor" class="primary" hidden>保存外观</button>
  </div>
</header>
<div class="workspace">
  <aside class="layers rail" aria-label="模块与外观">
    <div class="panel-head"><h2>模块</h2><button class="icon mobile-close" id="layers-close" aria-label="关闭模块">×</button></div>
    <div id="layers"></div>
    <div id="sticker-layers"></div>
    <div class="layer-tools">
      <label for="preset">外观预设</label>
      <select id="preset">
        <option value="">选择预设</option>
        <option value="light">极简白</option>
        <option value="dark">深色专注</option>
        <option value="paper">纸张</option>
      </select>
      <button id="copy">复制这套外观</button>
      <button id="reset" class="quiet">恢复默认</button>
    </div>
    <div class="panel-section">
      <label>背景</label>
      <div class="field-buttons">
        <input id="bg-color" type="color" value="#f4eee1" title="背景色">
        <button id="bg-image" type="button">选择图片</button>
        <button id="bg-clear" type="button" class="quiet">清除</button>
      </div>
      <select id="bg-fit" aria-label="填充">
        <option value="cover">cover</option>
        <option value="contain">contain</option>
        <option value="repeat">repeat</option>
      </select>
      <input id="bg-file" type="file" accept="image/*" hidden>
    </div>
  </aside>
  <main class="stage" aria-label="网盘画布">
    <div class="stage-bar">
      <div class="stage-label">
        <h2>网盘画布</h2><span>实时预览</span>
      </div>
      <div class="canvas-tools">
        <button id="add-sticker">添加贴图</button>
        <label class="snap-control"><input id="snap-grid" type="checkbox">网格吸附</label>
        <button id="layers-toggle" aria-expanded="false">模块</button>
        <div class="device" role="group" aria-label="预览尺寸">
          <button id="desktop" aria-pressed="true">桌面</button>
          <button id="phone" aria-pressed="false">手机</button>
        </div>
        <label class="zoom"><span class="sr-only">画布缩放</span><select id="zoom">
          <option value="1">100%</option><option value=".9">90%</option><option value=".8">80%</option><option value=".65">65%</option>
        </select></label>
      </div>
    </div>
    <div class="stage-scroll" id="stage-scroll">
      <div class="preview-shell">
        <iframe id="drive" title="SubDrive 实时预览"></iframe>
      </div>
    </div>
    <div class="stage-foot">
      <span>自由拖动与缩放 · 图片可拖到任意位置</span>
      <span><kbd>Alt</kbd> <kbd>↑</kbd> <kbd>↓</kbd> 换序 · <kbd>Esc</kbd> 取消</span>
      <button id="inspector-toggle" aria-expanded="false">属性</button>
    </div>
  </main>
  <aside class="inspector rail" aria-label="模块属性">
    <div class="panel-head"><h2>属性</h2><button class="icon mobile-close" id="inspector-close" aria-label="关闭属性">×</button></div>
    <div id="inspector"></div>
  </aside>
</div>
<div id="status" role="status" class="status"></div>
<input type="file" id="image-file" accept="image/png,image/jpeg,image/webp,image/gif,image/avif" hidden>
<dialog id="reset-dialog">
  <form method="dialog">
    <h2>恢复默认外观？</h2>
    <p>这会还原全部模块的样式和顺序。恢复后仍可撤销。</p>
    <div class="dialog-actions"><button value="cancel" autofocus>取消</button><button class="primary" value="reset">恢复默认</button></div>
  </form>
</dialog>

  toolbar: ".toolbar", shared: "#shared-card", files: "#dropzone", foot: ".drive-foot"
};
const defaultOrder = Object.keys(labels).slice(1);
const defaults = { visible: true, bg: "", fg: "", radius: null, width: 100,
  height: 0, image: "", fit: "cover", x: 50, y: 50 };
const light = () => ({ preset: "light", order: [...defaultOrder], blocks: {} });
const presets = {
  light,
  dark: () => ({ ...light(), preset: "dark", blocks: {
    quota: { bg: "#232733" }, files: { bg: "#1c2029" }
  }}),
  paper: () => ({ ...light(), preset: "paper", blocks: {
    quota: { bg: "#fff6e6", radius: 12 }, files: { bg: "#fffdf7", radius: 12 }
  }})
};
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
const block = (id, source = state) => ({ ...defaults, ...source.blocks[id] });
const withBlock = (id, patch) => ({
  ...state, blocks: { ...state.blocks, [id]: { ...state.blocks[id], ...patch } }
});
let editorBoot;
try { editorBoot = window.parent !== window ? window.parent.SUBDRIVE_EDITOR_BOOT : null; } catch {}
let state = editorBoot?.state ? structuredClone(editorBoot.state) : light();
let previewBackground = "";
state.order ||= [...defaultOrder];
state.blocks ||= {};
const past = [];
const future = [];
let selected = "files";
let editing = true;
let positioning = false;
let gesture;
let drawer;
let pendingImage;
let noticeTimer;
let drive;
const modules = {};
const handles = {};
const stickerNodes = new Map();

function ensureCanvas() {
  if (state.canvas) return state.canvas;
  const main = drive.querySelector(".drive-main");
  const origin = main.getBoundingClientRect();
  const blocks = {};
  for (const id of defaultOrder) {
    const rect = modules[id].getBoundingClientRect();
    blocks[id] = { x: rect.left - origin.left, y: rect.top - origin.top,
      w: rect.width || origin.width - 48, h: rect.height || 64 };
  }
  state = { ...state, canvas: { v: 1, snap: false, width: main.clientWidth,
    height: Math.max(main.scrollHeight + 200, 900), blocks, stickers: [] } };
  return state.canvas;
}

function canvasScale() {
  return state.canvas ? drive.querySelector(".drive-main").clientWidth / state.canvas.width : 1;
}

function nodeZ(id, source = state) {
  const c = source.canvas; if (!c) return 0;
  const b = c.blocks[id];
  if (b && Number.isFinite(b.z)) return b.z;
  const st = (c.stickers || []).find(s => s.id === id);
  if (st && Number.isFinite(st.z)) return st.z;
  const i = source.order.indexOf(id);
  return i >= 0 ? i + 1 : 999;
}
function zList(source = state) {
  const c = source.canvas; if (!c) return [];
  return [...Object.keys(c.blocks).filter(id => id !== "topbar"),
    ...(c.stickers || []).map(s => s.id)].sort((a, b) => nodeZ(a, source) - nodeZ(b, source));
}
function withZ(id, z, source) {
  const c = source.canvas;
  if ((c.stickers || []).some(s => s.id === id))
    return { ...source, canvas: { ...c, stickers: c.stickers.map(s => s.id === id ? { ...s, z } : s) } };
  return { ...source, canvas: { ...c, blocks: { ...c.blocks, [id]: { ...(c.blocks[id] || {}), z } } } };
}
function shiftZ(id, mode) {
  if (!state.canvas) return;
  const list = zList(); const i = list.indexOf(id); if (i < 0) return;
  const j = mode === "front" ? list.length - 1 : mode === "back" ? 0 : mode === "up" ? i + 1 : i - 1;
  if (j < 0 || j >= list.length || j === i) return;
  list.splice(j, 0, list.splice(i, 1)[0]);
  let next = state;
  list.forEach((nid, index) => { next = withZ(nid, index + 1, next); });
  commit(next);
}

function isSticker(id = selected) {
  return Boolean(state.canvas?.stickers.some(item => item.id === id));
}

function canvasPatch(id, patch) {
  const canvas = ensureCanvas();
  if (isSticker(id)) {
    const stickers = canvas.stickers.map(item => item.id === id ? { ...item, ...patch } : item);
    return { ...state, canvas: { ...canvas, height: Math.max(canvas.height,
      ...stickers.map(item => item.y + item.h + 40)), stickers } };
  }
  const rect = { ...canvas.blocks[id], ...patch };
  return { ...state, canvas: { ...canvas,
    height: Math.max(canvas.height, rect.y + rect.h + 40),
    blocks: { ...canvas.blocks, [id]: rect } } };
}

function renderCanvas(source) {
  const main = drive.querySelector(".drive-main");
  const canvas = source.canvas;
  main.classList.toggle("free-canvas", Boolean(canvas));
  main.classList.toggle("grid-visible", Boolean(canvas?.snap && editing));
  $("#snap-grid").checked = Boolean(canvas?.snap);
  if (!canvas) {
    main.style.minHeight = "";
    for (const node of Object.values(modules)) {
      for (const prop of ["position", "left", "top", "width", "height", "z-index"]) node.style.removeProperty(prop);
    }
  } else {
    const scale = main.clientWidth / canvas.width;
    let height = canvas.height;
    for (const [id, rect] of Object.entries(canvas.blocks)) {
      const node = modules[id];
      if (!node || id === "topbar") continue;
      Object.assign(node.style, { position: "absolute", left: rect.x * scale + "px",
        top: rect.y * scale + "px", width: rect.w * scale + "px", minHeight: rect.h * scale + "px",
        zIndex: String(nodeZ(id, source)) });
      height = Math.max(height, rect.y + Math.max(rect.h, node.offsetHeight / scale) + 40);
    }
    // 与生产画布相同，文字换行造成增高时只顺延原先不重叠的下方模块。
    const rows = Object.entries(canvas.blocks).filter(([id]) =>
      modules[id] && block(id, source).visible).map(([id, rect]) => ({
        node: modules[id], rect, top: rect.y * scale
      })).sort((a, b) => a.rect.y - b.rect.y);
    rows.forEach((row, index) => {
      rows.slice(0, index).forEach(above => {
        const gap = row.rect.y - above.rect.y - above.rect.h;
        const intersects = row.rect.x < above.rect.x + above.rect.w &&
          row.rect.x + row.rect.w > above.rect.x;
        if (intersects && gap >= -1) {
          row.top = Math.max(row.top, above.top + above.node.offsetHeight + Math.max(0, gap) * scale);
        }
      });
      row.node.style.top = row.top + "px";
      height = Math.max(height, (row.top + row.node.offsetHeight) / scale + 40);
    });
    const bg = canvas.bg || {};
    main.style.backgroundColor = bg.color || "";
    main.style.backgroundImage = bg.image ? 'url("' + bg.image + '")' : "";
    main.style.backgroundSize = bg.fit === "contain" ? "contain" : bg.fit === "repeat" ? "auto" : "cover";
    main.style.backgroundRepeat = bg.fit === "repeat" ? "repeat" : "no-repeat";
    for (const item of canvas.stickers) height = Math.max(height, item.y + item.h + 40);
    main.style.minHeight = height * scale + "px";
  }
  const ids = new Set(canvas?.stickers.map(item => item.id) || []);
  for (const [id, node] of stickerNodes) {
    if (!ids.has(id)) { node.remove(); stickerNodes.delete(id); }
  }
  for (const item of canvas?.stickers || []) {
    let node = stickerNodes.get(item.id);
    if (!node) {
      node = drive.createElement("div");
      node.className = "canvas-sticker";
      node.dataset.sticker = item.id;
      node.innerHTML = '<img alt="独立贴图"><button class="sticker-resize" aria-label="调整贴图尺寸">↘</button>';
      node.addEventListener("pointerdown", event => {
        if (!event.target.closest("button")) startGesture(event, item.id, "move", true);
      });
      node.addEventListener("focus", () => selectBlock(item.id));
      node.addEventListener("click", event => { event.stopPropagation(); selectBlock(item.id); });
      attachHandle(node.querySelector("button"), item.id, "size", true);
      main.append(node);
      stickerNodes.set(item.id, node);
    }
    const scale = main.clientWidth / canvas.width;
    Object.assign(node.style, { left: item.x * scale + "px", top: item.y * scale + "px",
      width: item.w * scale + "px", height: item.h * scale + "px", zIndex: String(nodeZ(item.id, source)) });
    node.querySelector("img").src = item.image;
    node.querySelector("button").hidden = !editing || selected !== item.id;
    node.classList.toggle("selected", editing && selected === item.id);
    node.tabIndex = editing ? 0 : -1;
  }
}

function renderStickerLayers() {}

function coordinateFields(rect) {
  return numberField("cx", "水平坐标 (px)", 0, 6000, 1, Math.round(rect.x)) +
    numberField("cy", "垂直坐标 (px)", 0, 12000, 1, Math.round(rect.y)) +
    numberField("cw", "宽度 (px)", 24, 6000, 1, Math.round(rect.w)) +
    numberField("ch", "高度 (px)", 24, 12000, 1, Math.round(rect.h));
}

async function addSticker(file, point) {
  ensureCanvas();
  try {
    const image = await prepareImage(file);
    const canvas = state.canvas || ensureCanvas();
    const id = "sticker-" + crypto.randomUUID();
    const w = Math.min(192, canvas.width - 32);
    const snap = value => canvas.snap ? Math.round(value / 8) * 8 : value;
    const sticker = { id, image, x: clamp(snap(point?.x ?? 32), 0, canvas.width - w),
      y: snap(point?.y ?? 32), w, h: w * 2 / 3 };
    selected = id;
    commit({ ...state, canvas: { ...canvas, height: Math.max(canvas.height, sticker.y + sticker.h + 40),
      stickers: [...canvas.stickers, sticker] } });
    notice("已添加独立贴图");
  } catch { notice("无法读取图片，请选择 20 MB 以内的图片"); }
}

function notice(message) {
  $("#status").textContent = message;
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => { $("#status").textContent = ""; }, 2500);
}

function commit(next) {
  if (JSON.stringify(next) === JSON.stringify(state)) return false;
  past.push(state);
  if (past.length > 40) past.shift();
  future.length = 0;
  state = next;
  render();
  return true;
}

function stepHistory(undo) {
  if (gesture) return;
  const from = undo ? past : future;
  const to = undo ? future : past;
  if (!from.length) return;
  to.push(state);
  state = from.pop();
  positioning = false;
  render();
  notice(undo ? "已撤销" : "已重做");
}

function selectBlock(id, open = false) {
  if (!editing) return;
  if (id !== selected) {
    selected = id;
    positioning = false;
    render();
  }
  if (open && matchMedia("(max-width: 899px)").matches) setDrawer("inspector", true);
}

function setDrawer(next, focus = false) {
  drawer = next;
  for (const name of ["layers", "inspector"]) {
    const open = drawer === name;
    $(".rail." + name).classList.toggle("is-open", open);
    $("#" + name + "-toggle").setAttribute("aria-expanded", String(open));
  }
  if (focus && drawer && matchMedia("(max-width: 899px)").matches) {
    $("#" + drawer + "-close").focus();
  }
}

function showEffect(value) {
  editing = !value;
  positioning = false;
  setDrawer(null);
  document.body.classList.toggle("show-effect", value);
  $("#preview").setAttribute("aria-pressed", String(value));
  $("#preview").textContent = value ? "返回编辑" : "查看效果";
  renderDrive();
}

function renderDrive(source = state) {
  if (!drive) return;
  const root = drive.documentElement;
  root.dataset.theme = source.preset === "dark" ? "dark" : "light";
  root.dataset.palette = source.preset;
  editorBoot?.refreshAccent?.(root);
  if (editorBoot) drive.body.style.backgroundColor = source.themeChanged
    ? (source.preset === "paper" ? "#f4eee1" : "") : previewBackground;
  root.classList.toggle("editing", editing);
  const main = drive.querySelector(".drive-main");
  const domOrder = [...main.querySelectorAll(":scope > .module")];
  if (source.order.some((id, index) => modules[id] !== domOrder[index])) {
    const focused = drive.activeElement;
    for (const id of source.order) main.append(modules[id]);
    if (main.contains(focused)) focused.focus({ preventScroll: true });
  }
  for (const [id, node] of Object.entries(modules)) {
    const props = block(id, source);
    const active = selected === id && editing;
    node.classList.toggle("module-selected", active);
    node.tabIndex = editing ? 0 : -1;
    node.style.display = props.visible ? "" : "none";
    node.style.order = String(source.order.indexOf(id));
    node.style.backgroundColor = props.bg;
    node.style.color = props.fg;
    node.style.setProperty("--module-fg", props.fg || "currentColor");
    node.classList.toggle("custom-fg", Boolean(props.fg));
    node.style.borderRadius = props.radius === null ? "" : props.radius + "px";
    node.style.setProperty("--module-width", props.width + "%");
    node.style.minHeight = props.height ? props.height + "px" : "";
    node.style.backgroundImage = props.image ? 'url("' + props.image + '")' : "";
    node.style.backgroundSize = props.fit;
    node.style.backgroundPosition = props.x + "% " + props.y + "%";
    const controls = handles[id];
    if (controls) {
      controls.group.hidden = !active;
      controls.pin.hidden = !(active && positioning && props.image);
      controls.pin.style.left = clamp(props.x, 4, 96) + "%";
      controls.pin.style.top = clamp(props.y, 8, 92) + "%";
    }
  }
  renderCanvas(source);
}

function renderLayers() {
  const layerList = $("#layers");
  const canvasIds = state.canvas ? zList().slice().reverse() : [];
  const flowIds = state.order.filter(id => !state.canvas?.blocks[id]);
  const ids = ["topbar", ...canvasIds, ...flowIds];
  const seen = new Set();
  for (const id of ids) {
    if (seen.has(id)) continue;
    seen.add(id);
    let item = layerList.querySelector('[data-id="' + id + '"]');
    if (!item) {
      if (isSticker(id)) item = stickerLayerRow(id);
      else if (labels[id]) item = moduleLayerRow(id);
      if (!item) continue;
      layerList.append(item);
    }
    item.querySelector(".layer-name span").textContent = isSticker(id) ? "贴图" : labels[id];
    item.querySelector(".layer-meta").textContent = id === "topbar" ? "固定"
      : isSticker(id) ? "贴图" : !block(id).visible ? "已隐藏" : "";
    item.classList.toggle("is-selected", id === selected);
    item.querySelector(".layer-name").setAttribute("aria-pressed", String(id === selected));
  }
  for (const item of [...layerList.children]) if (!seen.has(item.dataset.id)) item.remove();
  for (const id of ids) {
    const el = layerList.querySelector('[data-id="' + id + '"]');
    if (el) layerList.append(el);
  }
  const legacy = $("#sticker-layers");
  if (legacy) legacy.innerHTML = "";
}

const resetButton = (key, label) =>
  '<button class="icon clear" data-reset="' + key + '" title="重置' + label +
  '" aria-label="重置' + label + '">↺</button>';
const field = (key, label, input) =>
  '<div class="field"><label for="prop-' + key + '">' + label + '</label>' +
  input + resetButton(key, label) + '</div>';
const numberField = (key, label, min, max, step, value) => field(key, label,
  '<input id="prop-' + key + '" data-prop="' + key + '" type="number" min="' + min +
  '" max="' + max + '" step="' + step + '" value="' + value + '">');
function colorField(key, label, value, fallback) {
  return field(key, label, '<div class="color-control"><input id="prop-' + key +
    '" data-prop="' + key + '" type="text" maxlength="7" spellcheck="false" placeholder="默认" value="' +
    value + '"><input data-prop="' + key + '" type="color" aria-label="选择' + label + '" value="' +
    (value || fallback) + '"></div>');
}

function renderInspector() {
  const panel = $("#inspector");
  const focus = panel.contains(document.activeElement) ? document.activeElement : null;
  const focusSelector = focus?.id ? "#" + focus.id
    : focus?.dataset.reset ? '[data-reset="' + focus.dataset.reset + '"]'
    : focus?.dataset.action ? '[data-action="' + focus.dataset.action + '"]'
    : focus?.type === "color" ? 'input[type=color][data-prop="' + focus.dataset.prop + '"]'
    : null;
  if (!selected) {
    panel.innerHTML = '<p class="empty-inspector">在画布或模块列表中选择一个模块。</p>';
    return;
  }
  if (isSticker()) {
    const sticker = state.canvas.stickers.find(item => item.id === selected);
    panel.innerHTML = '<div class="selected-head"><h3>独立贴图</h3><p>可拖到画布任意位置</p></div>' +
      '<section class="group">' + coordinateFields(sticker) +
      '<div class="field-buttons z-buttons"><button data-action="z-front">置顶</button>' +
      '<button data-action="z-up">上移一层</button><button data-action="z-down">下移一层</button>' +
      '<button data-action="z-back">置底</button></div>' +
      '<div class="field-buttons"><button data-action="delete-sticker">删除贴图</button></div></section>';
    if (focusSelector) panel.querySelector(focusSelector)?.focus({ preventScroll: true });
    return;
  }
  const id = selected;
  const props = block(id);
  const fixed = id === "topbar";
  const group = (name, content) => '<section class="group"><h3>' + name + '</h3>' + content + '</section>';
  const fill = state.preset === "dark" ? "#20232c" : "#ffffff";
  const ink = state.preset === "dark" ? "#f1f0ed" : "#252421";
  const layout = fixed ? "" : group("布局",
    field("visible", "显示模块", '<input id="prop-visible" data-prop="visible" type="checkbox" ' +
      (props.visible ? "checked" : "") + ">") +
    (state.canvas?.blocks[id] ? coordinateFields(state.canvas.blocks[id]) :
      numberField("width", "宽度 (%)", 10, 100, 1, props.width) +
      numberField("height", "最小高度 (px)", 0, 480, 4, props.height) +
      (props.height ? "" : '<p class="hint">高度 0 表示随内容调整。</p>')) +
    '<div class="field-buttons"><button data-action="up" ' +
    (state.order[0] === id ? "disabled" : "") + '>上移</button><button data-action="down" ' +
    (state.order.at(-1) === id ? "disabled" : "") + '>下移</button>' +
    resetButton("order", "顺序") + "</div>");
  const layers = group("图层",
    '<div class="field-buttons z-buttons"><button data-action="z-front">置顶</button>' +
    '<button data-action="z-up">上移一层</button><button data-action="z-down">下移一层</button>' +
    '<button data-action="z-back">置底</button></div>');
  const style = group("外观", colorField("bg", "背景色", props.bg, fill) +
    colorField("fg", "文字色", props.fg, ink) +
    (fixed ? "" : numberField("radius", "圆角 (px)", 0, 32, 1, props.radius ?? 8)));
  const sticker = fixed ? "" : group("贴图",
    (props.image ? '<img class="sticker-preview" alt="当前贴图">' :
      '<p class="hint">上传图片，也可以从示例开始。</p>') +
    '<div class="field-buttons"><button data-action="upload">' + (props.image ? "换图" : "添加贴图") +
    '</button><button data-action="sample">试用示例</button>' +
    (props.image ? '<button data-reset="image">删除贴图</button>' : "") + "</div>" +
    (props.image ? field("fit", "填充方式", '<select id="prop-fit" data-prop="fit"><option value="cover"' +
      (props.fit === "cover" ? " selected" : "") + '>铺满</option><option value="contain"' +
      (props.fit === "contain" ? " selected" : "") + '>完整显示</option></select>') +
      numberField("x", "水平位置 (%)", 0, 100, 1, props.x) +
      numberField("y", "垂直位置 (%)", 0, 100, 1, props.y) +
      '<div class="field-buttons"><button class="sticker-target" data-action="position" aria-pressed="' +
      positioning + '"' + (props.visible ? "" : " disabled") + '>在画布定位</button></div>' : ""));
  panel.innerHTML = '<div class="selected-head"><h3>' + labels[id] + "</h3><p>" +
    (fixed ? "固定模块，可调整配色" : props.visible ? "显示于网盘" : "已隐藏，可在这里恢复") +
    "</p></div>" + layout + layers + style + sticker;
  if (props.image) panel.querySelector(".sticker-preview").src = props.image;
  if (focusSelector) panel.querySelector(focusSelector)?.focus({ preventScroll: true });
}

function render() {
  if (selected && !labels[selected] && !isSticker()) selected = null;
  renderDrive();
  renderLayers();
  renderStickerLayers();
  renderInspector();
  $("#undo").disabled = !past.length;
  $("#redo").disabled = !future.length;
}

function moveBlock(id, offset) {
  const index = state.order.indexOf(id);
  if (index < 0) return;
  const next = clamp(index + offset, 0, state.order.length - 1);
  if (index === next) return;
  const order = [...state.order];
  order.splice(index, 1);
  order.splice(next, 0, id);
  let canvas = state.canvas;
  if (canvas) {
    const blocks = { ...canvas.blocks };
    order.forEach((key, position) => {
      const destination = canvas.blocks[state.order[position]];
      const current = canvas.blocks[key];
      if (current && destination) blocks[key] = { ...current,
        x: clamp(destination.x, 0, Math.max(0, canvas.width - current.w)), y: destination.y };
    });
    canvas = { ...canvas, blocks };
  }
  commit({ ...state, order, ...(canvas ? { canvas } : {}) });
  notice(labels[id] + "移至第 " + (next + 1) + " 位");
}

function reorderFromPointer(current, event) {
  const { id, inFrame } = current;
  const remaining = state.order.filter(key => key !== id);
  const surface = inFrame ? drive : document;
  const getNode = key => inFrame ? modules[key] : $('#layers [data-id="' + key + '"]');
  const candidates = remaining.filter(key => !inFrame || block(key).visible);
  const before = candidates.find(key => {
    const rect = getNode(key).getBoundingClientRect();
    return event.clientY < rect.top + rect.height / 2;
  });
  const after = before ? null : candidates.at(-1);
  surface.querySelectorAll(".insert-before, .insert-after").forEach(node => {
    node.classList.remove("insert-before", "insert-after");
  });
  if (before || after) getNode(before || after).classList.add(before ? "insert-before" : "insert-after");
  const destination = before ? remaining.indexOf(before) : after ? remaining.indexOf(after) + 1 : -1;
  if (destination >= 0) remaining.splice(destination, 0, id);
  current.order = destination >= 0 ? remaining : state.order;
}

function startGesture(event, id, kind, inFrame) {
  if (!editing || gesture || event.button !== 0) return;
  event.preventDefault();
  event.stopPropagation();
  selectBlock(id);
  const handle = event.currentTarget;
  handle.setPointerCapture(event.pointerId);
  if (inFrame && kind !== "position") ensureCanvas();
  const node = modules[id] || stickerNodes.get(id);
  const rect = node.getBoundingClientRect();
  const parentWidth = drive.querySelector(".drive-main").clientWidth -
    parseFloat(iframe.contentWindow.getComputedStyle(drive.querySelector(".drive-main")).paddingInlineStart) * 2;
  gesture = { handle, id, kind, inFrame, rect, parentWidth, x: event.clientX,
    y: event.clientY, pointerId: event.pointerId, moved: false };
  if (inFrame && kind !== "position") {
    gesture.original = isSticker(id) ? state.canvas.stickers.find(item => item.id === id) : state.canvas.blocks[id];
    gesture.scale = canvasScale();
  }
  handle.addEventListener("pointermove", updateGesture);
  handle.addEventListener("pointerup", finishGesture);
  handle.addEventListener("pointercancel", cancelGesture);
  handle.addEventListener("lostpointercapture", cancelGesture);
}

function updateGesture(event) {
  if (!gesture || event.pointerId !== gesture.pointerId) return;
  const current = gesture;
  const dx = event.clientX - current.x;
  const dy = event.clientY - current.y;
  if (!current.moved && Math.hypot(dx, dy) < 4) return;
  current.moved = true;
  if (current.inFrame && current.original && ["move", "size"].includes(current.kind)) {
    const rect = current.original;
    const scale = current.scale;
    const snap = value => state.canvas.snap ? Math.round(value / 8) * 8 : Math.round(value);
    const patch = current.kind === "move"
      ? { x: Math.max(0, snap(rect.x + dx / scale)), y: Math.max(0, snap(rect.y + dy / scale)) }
      : { w: Math.max(24, snap(rect.w + dx / scale)), h: Math.max(24, snap(rect.h + dy / scale)) };
    patch.x = patch.x === undefined ? undefined : Math.min(patch.x, Math.max(0, state.canvas.width - rect.w));
    if (patch.x === undefined) delete patch.x;
    if (patch.w !== undefined) patch.w = Math.min(patch.w, state.canvas.width - rect.x);
    current.canvasPatch = patch;
    renderDrive(canvasPatch(current.id, patch));
    return;
  }
  if (current.kind === "order") {
    reorderFromPointer(current, event);
    if (current.inFrame) {
      const height = drive.documentElement.clientHeight;
      if (event.clientY < 32) iframe.contentWindow.scrollBy(0, -16);
      if (event.clientY > height - 32) iframe.contentWindow.scrollBy(0, 16);
    }
    return;
  }
  const { rect, parentWidth, id } = current;
  const px = value => Math.round(value / 4) * 4;
  if (current.kind === "size") {
    const patch = {};
    if (Math.abs(dx) >= 4) {
      patch.width = clamp(px((rect.width + dx) * 100 / parentWidth), parentWidth < 500 ? 80 : 56, 100);
    }
    if (Math.abs(dy) >= 4) patch.height = clamp(px(rect.height + dy), 0, 480);
    current.patch = patch;
  } else {
    current.patch = {
      x: clamp(Math.round((event.clientX - rect.left) * 100 / rect.width), 0, 100),
      y: clamp(Math.round((event.clientY - rect.top) * 100 / rect.height), 0, 100)
    };
  }
  renderDrive(withBlock(id, current.patch));
}

function clearGesture() {
  const current = gesture;
  if (!current) return null;
  gesture = null;
  const { handle, pointerId } = current;
  handle.removeEventListener("pointermove", updateGesture);
  handle.removeEventListener("pointerup", finishGesture);
  handle.removeEventListener("pointercancel", cancelGesture);
  handle.removeEventListener("lostpointercapture", cancelGesture);
  if (handle.hasPointerCapture(pointerId)) handle.releasePointerCapture(pointerId);
  for (const surface of [document, drive]) {
    surface?.querySelectorAll(".insert-before, .insert-after").forEach(node =>
      node.classList.remove("insert-before", "insert-after"));
  }
  return current;
}
function finishGesture() {
  const current = clearGesture();
  if (!current) return;
  if (current.canvasPatch) {
    commit(canvasPatch(current.id, current.canvasPatch));
  } else if (current.order && current.order.some((id, index) => id !== state.order[index])) {
    commit({ ...state, order: current.order });
    notice(labels[current.id] + "已换序");
  } else if (current.patch && Object.keys(current.patch).length) {
    commit(withBlock(current.id, current.patch));
  }
  renderDrive();
}
function cancelGesture() {
  clearGesture();
  renderDrive();
}

function keyboard(event) {
  if (event.defaultPrevented || event.isComposing || $("#reset-dialog").open) return;
  if (event.key === "Escape") {
    event.preventDefault();
    if (gesture) cancelGesture();
    else if (!editing) showEffect(false);
    else if (positioning) { positioning = false; render(); }
    else {
      if (drawer) setDrawer(null);
      if (selected) selectBlock(null);
    }
    return;
  }
  if (event.target.closest("input, select, textarea, [contenteditable=true]") || !editing) return;
  if (selected && !event.altKey && !event.ctrlKey && !event.metaKey && (event.key === "]" || event.key === "[")) {
    event.preventDefault();
    shiftZ(selected, event.key === "]" ? (event.shiftKey ? "front" : "up") : (event.shiftKey ? "back" : "down"));
    return;
  }
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "z") {
    event.preventDefault();
    stepHistory(!event.shiftKey);
  }
  if (selected && event.altKey && ["ArrowUp", "ArrowDown"].includes(event.key)) {
    event.preventDefault();
    moveBlock(selected, event.key === "ArrowUp" ? -1 : 1);
  }
  if (selected && state.canvas && !event.altKey && ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(event.key)) {
    const rect = isSticker() ? state.canvas.stickers.find(item => item.id === selected) : state.canvas.blocks[selected];
    if (rect) {
      event.preventDefault();
      const amount = event.shiftKey ? 8 : 1;
      const x = rect.x + (event.key === "ArrowRight" ? amount : event.key === "ArrowLeft" ? -amount : 0);
      const y = rect.y + (event.key === "ArrowDown" ? amount : event.key === "ArrowUp" ? -amount : 0);
      commit(canvasPatch(selected, { x: clamp(x, 0, state.canvas.width - rect.w), y: Math.max(0, y) }));
    }
  }
  if (isSticker() && ["Delete", "Backspace"].includes(event.key)) {
    event.preventDefault();
    deleteSticker();
  }
}

function attachHandle(button, id, kind, inFrame) {
  button.addEventListener("pointerdown", event => startGesture(event, id, kind, inFrame));
}

function moduleLayerRow(id) {
  const label = labels[id];
  const item = document.createElement("div");
  item.className = "layer";
  item.dataset.id = id;
  item.innerHTML = '<button class="layer-handle" tabindex="-1" aria-label="拖动 ' + label + '">' +
    (id === "topbar" ? "·" : "⠿") + '</button><button class="layer-name"><span>' + label +
    '</span><span class="layer-meta"></span></button>';
  const grip = item.firstElementChild;
  if (id === "topbar") grip.disabled = true;
  else attachHandle(grip, id, "order", false);
  const button = item.querySelector(".layer-name");
  button.addEventListener("focus", () => selectBlock(id));
  button.addEventListener("click", () => selectBlock(id, true));
  return item;
}

function stickerLayerRow(id) {
  const item = document.createElement("div");
  item.className = "layer";
  item.dataset.id = id;
  item.innerHTML = '<button class="layer-handle" tabindex="-1" aria-label="贴图">◧</button>' +
    '<button class="layer-name"><span>贴图</span><span class="layer-meta">贴图</span></button>';
  item.firstElementChild.disabled = true;
  const button = item.querySelector(".layer-name");
  button.addEventListener("focus", () => selectBlock(id));
  button.addEventListener("click", () => selectBlock(id, true));
  return item;
}

function buildLayers() {
  for (const id of Object.keys(labels)) $("#layers").append(moduleLayerRow(id));
}

function initDrive() {
  drive = iframe.contentDocument;
  previewBackground = drive.body.style.backgroundColor;
  drive.querySelectorAll("button, input, a").forEach(node => { node.tabIndex = -1; });
  for (const [id, selector] of Object.entries(selectors)) {
    const node = drive.querySelector(selector);
    node.classList.add("module");
    node.setAttribute("aria-label", labels[id]);
    if (id !== "topbar") {
      const group = drive.createElement("div");
      group.className = "module-controls";
      group.innerHTML = '<button class="module-grip" tabindex="-1" title="自由拖动" aria-label="自由拖动">⠿</button>' +
        '<button class="module-size" tabindex="-1" title="拖动调整尺寸" aria-label="拖动调整尺寸">↘</button>' +
        '<button class="module-pin" tabindex="-1" title="拖动贴图定位" aria-label="拖动贴图定位">＋</button>';
      const [grip, resize, pin] = group.children;
      node.append(group);
      attachHandle(grip, id, "move", true);
      attachHandle(resize, id, "size", true);
      attachHandle(pin, id, "position", true);
      handles[id] = { group, pin };
    }
    modules[id] = node;
    node.addEventListener("focus", () => selectBlock(id));
    node.addEventListener("click", event => {
      if (!editing || event.target.closest(".module-controls")) return;
      selectBlock(id);
      if (drawer === "layers") setDrawer(null);
    });
    if (id !== "topbar") {
      node.addEventListener("pointerdown", event => {
        if (!event.target.closest(".module-controls, input, button, a")) startGesture(event, id, "move", true);
      });
      node.addEventListener("dragover", event => {
        if (editing && event.dataTransfer.types.includes("Files")) {
          event.preventDefault();
          event.dataTransfer.dropEffect = "copy";
          node.classList.add("sticker-drop");
        }
      });
      node.addEventListener("dragleave", event => {
        if (!node.contains(event.relatedTarget)) node.classList.remove("sticker-drop");
      });
      node.addEventListener("drop", event => {
        if (!editing) return;
        event.preventDefault();
        node.classList.remove("sticker-drop");
        selectBlock(id);
        // 图片统一由画布处理，以落点创建独立贴图。
      });
    }
  }
  drive.addEventListener("dragover", event => event.preventDefault());
  drive.addEventListener("drop", event => {
    event.preventDefault();
    if (!editing) return;
    const file = event.dataTransfer.files[0];
    if (!file) return;
    ensureCanvas();
    const rect = drive.querySelector(".drive-main").getBoundingClientRect();
    const scale = canvasScale();
    addSticker(file, { x: clamp((event.clientX - rect.left) / scale, 0, state.canvas.width - 24),
      y: Math.max(0, (event.clientY - rect.top) / scale) });
  });
  drive.addEventListener("click", event => {
    if (event.target.closest("button, a, input")) event.preventDefault();
    if (editing && !event.target.closest(".module, .canvas-sticker")) selectBlock(null);
  });
  drive.addEventListener("keydown", keyboard);
  new ResizeObserver(() => { if (!gesture) renderDrive(); }).observe(drive.querySelector(".drive-main"));
  renderDrive();
}

$("#inspector").addEventListener("input", event => {
  const input = event.target;
  if (input.dataset.prop?.startsWith("c") && ["cx", "cy", "cw", "ch"].includes(input.dataset.prop)) {
    if (input.value !== "" && input.validity.valid) renderDrive(canvasPatch(selected, { [input.dataset.prop.slice(1)]: input.valueAsNumber }));
    return;
  }
  if (input.type === "color") {
    renderDrive(withBlock(selected, { [input.dataset.prop]: input.value }));
    $("#prop-" + input.dataset.prop).value = input.value;
  } else if (input.type === "number" && input.value !== "" && input.validity.valid) {
    renderDrive(withBlock(selected, { [input.dataset.prop]: input.valueAsNumber }));
  }
});
$("#inspector").addEventListener("change", event => {
  const input = event.target;
  const key = input.dataset.prop;
  if (!key || !selected) return;
  if (["cx", "cy", "cw", "ch"].includes(key)) {
    if (!Number.isFinite(input.valueAsNumber)) { render(); return; }
    const canvas = ensureCanvas();
    const rect = isSticker() ? canvas.stickers.find(item => item.id === selected) : canvas.blocks[selected];
    const max = key === "cx" ? canvas.width - rect.w : key === "cw" ? canvas.width - rect.x : Number(input.max);
    commit(canvasPatch(selected, { [key.slice(1)]: clamp(input.valueAsNumber, Number(input.min), max) }));
    return;
  }
  let value = input.value;
  if (input.type === "number") {
    if (!Number.isFinite(input.valueAsNumber)) { render(); return; }
    const step = Number(input.step);
    value = clamp(Number(input.min) + Math.round((input.valueAsNumber - Number(input.min)) / step) * step,
      Number(input.min), Number(input.max));
  } else if (input.type === "checkbox") {
    value = input.checked;
    if (!value) positioning = false;
  }
  else if (input.type === "text" && value && !/^#[a-f\d]{6}$/i.test(value)) {
    notice("请输入六位十六进制颜色，例如 #5038BD");
    render();
    return;
  }
  if (!commit(withBlock(selected, { [key]: value }))) render();
});

$("#inspector").addEventListener("click", event => {
  const button = event.target.closest("button");
  if (!button || !selected) return;
  const key = button.dataset.reset;
  const id = selected;
  if (["cx", "cy", "cw", "ch"].includes(key)) {
    const value = { cx: 24, cy: 24, cw: 192, ch: 128 }[key];
    commit(canvasPatch(id, { [key.slice(1)]: value }));
    return;
  }
  if (button.dataset.action === "delete-sticker") { deleteSticker(); return; }
  if (key === "order") moveBlock(id, defaultOrder.indexOf(id) - state.order.indexOf(id));
  else if (key === "image") {
    positioning = false;
    commit(withBlock(id, { image: "", fit: "cover", x: 50, y: 50 }));
  } else if (key) commit(withBlock(id, { [key]: defaults[key] }));
  const action = button.dataset.action;
  if (action === "up" || action === "down") moveBlock(id, action === "up" ? -1 : 1);
  if (["z-front", "z-up", "z-down", "z-back"].includes(action)) { shiftZ(id, action.slice(2)); return; }
  if (action === "sample") commit(withBlock(id, { image: sampleSticker, fit: "cover", x: 50, y: 50 }));
  if (action === "upload") { pendingImage = id; $("#image-file").click(); }
  if (action === "position") {
    positioning = !positioning;
    if (positioning) {
      setDrawer(null);
      modules[id].scrollIntoView({ block: "nearest" });
      notice("拖动画布上的定位点");
    }
    render();
  }
});

async function prepareImage(file) {
  if (!file.type.startsWith("image/") || file.size > 20 * 1024 * 1024) throw new Error();
  const bitmap = await createImageBitmap(file);
  try {
    const scale = Math.min(1, 1440 / Math.max(bitmap.width, bitmap.height));
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(bitmap.width * scale));
    canvas.height = Math.max(1, Math.round(bitmap.height * scale));
    canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL("image/webp", 0.82);
  } finally { bitmap.close(); }
}

async function applyImage(id, file) {
  const before = state;
  try {
    const image = await prepareImage(file);
    if (state !== before) {
      notice("外观已更改，请重新添加贴图");
      return;
    }
    commit(withBlock(id, { image, fit: "cover", x: 50, y: 50 }));
    notice("已添加贴图");
  } catch {
    notice("无法读取图片，请选择 20 MB 以内的 PNG、JPEG 或 WebP");
  }
}
$("#image-file").addEventListener("change", event => {
  const file = event.target.files[0];
  event.target.value = "";
  if (pendingImage === "canvas" && file) addSticker(file);
  else if (pendingImage && file) applyImage(pendingImage, file);
});

function deleteSticker() {
  const id = selected;
  selected = null;
  commit({ ...state, canvas: { ...state.canvas,
    stickers: state.canvas.stickers.filter(item => item.id !== id) } });
}

$("#add-sticker").addEventListener("click", () => {
  pendingImage = "canvas";
  $("#image-file").click();
});
$("#snap-grid").addEventListener("change", event => {
  const canvas = ensureCanvas();
  commit({ ...state, canvas: { ...canvas, snap: event.target.checked } });
});
if (editorBoot) {
  $("#save-editor").hidden = false;
  $("#close-editor").hidden = false;
  $(".stage-label span").textContent = "实时预览";
  $("#save-editor").addEventListener("click", () =>
    { ensureCanvas(); parent.postMessage({ type: "subdrive-editor-save", state, themeChanged: state.themeChanged === true }, location.origin); });
  $("#close-editor").addEventListener("click", () =>
    parent.postMessage({ type: "subdrive-editor-close" }, location.origin));
}
window.addEventListener("message", event => {
  if (event.source === parent && event.origin === location.origin && event.data?.type === "subdrive-editor-error") {
    notice(event.data.message);
  }
});

$("#copy").addEventListener("click", async () => {
  let payload;
  try {
    if (editorBoot) ensureCanvas();
    payload = editorBoot ? editorBoot.draftPackage(state, state.themeChanged === true)
      : { kind: "subdrive-blocks-prototype", v: 1, ...state };
  } catch {
    notice("外观过大，无法复制");
    return;
  }
  const copy = JSON.stringify(payload, null, 2);
  try {
    await navigator.clipboard.writeText(copy);
    notice("已复制外观");
  } catch {
    const url = URL.createObjectURL(new Blob([copy], { type: "application/json" }));
    const link = document.createElement("a");
    link.href = url;
    link.download = editorBoot ? "subdrive-look.json" : "subdrive-appearance-draft.json";
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    notice("已下载外观");
  }
});

$("#preset").addEventListener("change", event => {
  const name = event.target.value;
  if (!name) return;
  positioning = false;
  commit({ ...presets[name](), themeChanged: true });
  notice("已应用「" + event.target.selectedOptions[0].textContent + "」");
  event.target.value = "";
});
$("#reset").addEventListener("click", () => $("#reset-dialog").showModal());
$("#reset-dialog").addEventListener("close", event => {
  if (event.target.returnValue !== "reset") return;
  event.target.returnValue = "";
  positioning = false;
  commit({ ...light(), themeChanged: true });
  notice("已恢复默认");
});
$("#undo").addEventListener("click", () => stepHistory(true));
$("#redo").addEventListener("click", () => stepHistory(false));
$("#preview").addEventListener("click", () => showEffect(editing));
for (const name of ["layers", "inspector"]) {
  $("#" + name + "-toggle").addEventListener("click", () => setDrawer(drawer === name ? null : name, true));
  $("#" + name + "-close").addEventListener("click", () => {
    setDrawer(null);
    $("#" + name + "-toggle").focus();
  });
}
for (const name of ["desktop", "phone"]) {
  $("#" + name).addEventListener("click", () => {
    document.body.classList.toggle("phone", name === "phone");
    $("#desktop").setAttribute("aria-pressed", String(name === "desktop"));
    $("#phone").setAttribute("aria-pressed", String(name === "phone"));
  });
}
$("#zoom").addEventListener("change", event => {
  const ratio = Number(event.target.value);
  iframe.style.zoom = String(ratio);
  document.body.style.setProperty("--zoom", String(ratio));
});
document.addEventListener("keydown", keyboard);
buildLayers();
render();
iframe.addEventListener("load", initDrive, { once: true });
iframe.srcdoc = editorBoot?.preview || previewDocument;


$("#bg-color").addEventListener("input", event => {
  const c = ensureCanvas();
  commit({ ...state, canvas: { ...c, bg: { ...(c.bg || {}), color: event.target.value } } });
});
$("#bg-fit").addEventListener("change", event => {
  const c = ensureCanvas();
  commit({ ...state, canvas: { ...c, bg: { ...(c.bg || {}), fit: event.target.value } } });
});
$("#bg-image").addEventListener("click", () => $("#bg-file").click());
$("#bg-file").addEventListener("change", async event => {
  const file = event.target.files && event.target.files[0];
  event.target.value = "";
  if (!file) return;
  try {
    const image = await prepareImage(file);
    const c = ensureCanvas();
    commit({ ...state, canvas: { ...c, bg: { ...(c.bg || {}), image, fit: c.bg?.fit || "cover" } } });
  } catch { notice("图片无法读取"); }
});
$("#bg-clear").addEventListener("click", () => {
  const c = ensureCanvas();
  commit({ ...state, canvas: { ...c, bg: {} } });
});
</script>
</body>
